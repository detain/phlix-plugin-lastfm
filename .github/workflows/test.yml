name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # phlix-shared requires PHP ^8.3, so the matrix matches.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      # phpunit.xml declares <report><cobertura outputFile="coverage.xml"/>, and
      # setup-php provides pcov above, so ./coverage.xml is written by the run
      # itself - no extra --coverage flag is needed.
      - name: Upload coverage to Codacy
        # M-LASTFM-CLUSTER (codacy-sibling cure, review lastfm__docmaint, 2026-10-29),
        # mirroring myanimelist f4fa90e. The upload was GREEN here at 2ffb7db
        # (Oct 20: "Coverage data uploaded. Coverage received successfully.").
        # The same day, the sibling's POST to api.codacy.com began failing with
        # "Failed to create coverage: No Write permission on Project" — a
        # SERVER-side write-grant flip, invisible to anything repo-side: same
        # action commit (89d6c85, the pin is kept unchanged), same secret, same
        # reporter binary. The old posture papered that over with
        # `continue-on-error: true`, which is exactly the silent-misreport the
        # mal review named and rejected: lastfm's next push would fail the
        # upload, leave one warning annotation nobody reads, and keep the whole
        # matrix green.
        #
        # Cure: the fail-closed enable switch. With the switch unset the step
        # renders SKIPPED — an honest, unmistakable "this check is off" — and
        # once re-armed any renewed failure goes red on purpose. OWNER half, in
        # order: restore Codacy write access (github.com/settings/installations
        # -> Codacy -> confirm this repo is still granted; app.codacy.com ->
        # project -> settings -> project API token -> update the
        # CODACY_API_TOKEN repo secret), then set the repository custom
        # variable CODACY_COVERAGE_ENABLED=true to re-arm. If Codacy is not
        # worth keeping, delete this step outright — no gate here depends on
        # it (the S440 guard test slices the workflow from `composer-audit:`
        # onward; this step is outside its law).
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # One upload only - both matrix legs produce an identical report;
        # fail-closed Codacy switch (see above) gates the other half.
        if: ${{ matrix.php == '8.3' && vars.CODACY_COVERAGE_ENABLED == 'true' }}
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

      # Level/paths mirror phpstan.neon (level 9, src). No PHPCS step: squizlabs
      # is not a dependency of this repo, so the gate is phpstan-only.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=9

  # S246 — this repository had NO security audit gate at all. On 2026-08-06 a
  # HIGH advisory (CVE-2026-67434, OS command injection, GHSA-hmqg-cxww-wqhq)
  # landed against squizlabs/php_codesniffer and nothing here would ever have
  # said so. The sibling repos that DID have a gate ran `composer audit --no-dev`,
  # which drops every development dependency from the audited set and so could
  # not fail on it either.
  #
  # This job audits the WHOLE lock — runtime and development — and prints the
  # corpus it examined. Read scripts/security-audit-check.php for the policy and
  # its reasoning.
  #
  # Do NOT add a development-dependency exclusion, do NOT add continue-on-error
  # to the step below, and do NOT wrap it in a conditional: the guard test
  # tests/Unit/SecurityAuditCheckTest.php parses this file and fails on each of those edits.
  #
  # Keep this job LAST in the file — that guard test slices the workflow from
  # `composer-audit:` to the end and asserts the slice is not neutered.
  composer-audit:
    name: Security Audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: '8.3'
          tools: composer:v2

      # `--locked` audits composer.lock and needs no vendor/, so there is
      # deliberately no `composer install` step here.
      - name: Run Security Audit (runtime AND development dependencies)
        run: php scripts/security-audit-check.php
