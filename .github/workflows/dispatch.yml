name: Dispatch

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch to phlix-plugins catalog
        env:
          GH_TOKEN: ${{ secrets.PHLIX_BOT_TOKEN }}
          PHLIX_DISPATCH_REF: ${{ github.ref }}
          PHLIX_DISPATCH_SHA: ${{ github.sha }}
          PHLIX_DISPATCH_REPO: ${{ github.repository }}
        run: |
          gh api repos/detain/phlix-plugins/dispatches \
            --field event_type=plugin-push \
            --field "client_payload[ref]=${PHLIX_DISPATCH_REF}" \
            --field "client_payload[sha]=${PHLIX_DISPATCH_SHA}" \
            --field "client_payload[repo]=${PHLIX_DISPATCH_REPO}"
